version: '3.8'
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: listings
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
