# GigBid full stack:  docker compose -f infra/docker-compose.yml up --build   (or `make up`)
# Then:               docker compose -f infra/docker-compose.yml exec api python -m scripts.seed
# Web on http://localhost:3000, API docs on http://localhost:8000/docs, GigSim on :8081.
# Optional local LLM: add `--profile local-llm` and set MODEL_PROFILE=local (needs ~4 GB free RAM).

name: gigbid

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://gigbid:gigbid@postgres:5432/gigbid
  REDIS_URL: redis://redis:6379/0
  GIGSIM_BASE_URL: http://gigsim:8081
  OLLAMA_BASE_URL: http://ollama:11434
  MCP_PORTFOLIO_URL: http://mcp:8101/mcp
  MCP_MARKETPLACE_URL: http://mcp:8102/mcp
  MCP_WORKSPACE_URL: http://mcp:8103/mcp
  WEB_BASE_URL: http://localhost:3000
  GIGBID_IN_PROCESS_MCP: "0"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_PASSWORD: gigbid
      POSTGRES_DB: gigbid
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid -d gigbid"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gigsim:
    build: { context: .., dockerfile: infra/docker/gigsim.Dockerfile }
    environment:
      GIGSIM_API_TOKEN: ${GIGSIM_API_TOKEN:-dev-token}
      GIGSIM_CHAOS_RATE: ${GIGSIM_CHAOS_RATE:-0.02}
    ports: ["8081:8081"]
    volumes: ["gigsimdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build: { context: .., dockerfile: infra/docker/mcp.Dockerfile }
    env_file: ../.env
    environment: *backend-env
    ports: ["8101:8101", "8102:8102", "8103:8103"]
    volumes: ["models:/models", "mcpdata:/app/data/processed", "personas:/app/data/personas"]
    depends_on:
      postgres: { condition: service_healthy }
      gigsim: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    env_file: ../.env
    environment: *backend-env
    ports: ["8000:8000"]
    volumes: ["models:/models", "personas:/app/data/personas"]  # seeded from the image on first run; uploads persist
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp: { condition: service_started }

  worker:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    env_file: ../.env
    environment: *backend-env
    volumes: ["models:/models"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: { API_URL: "http://api:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  redisdata:
  gigsimdata:
  models:
  mcpdata:
  personas:
  ollama:
