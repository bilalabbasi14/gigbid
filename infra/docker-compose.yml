# GigBid full stack. `docker compose -f infra/docker-compose.yml up` (or `make up`).
# Services are added per milestone; the ones below are the foundation.
# Optional local LLM: `--profile local-llm` adds an Ollama service (needs ~4 GB RAM free).

name: gigbid

x-env: &app-env
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://gigbid:gigbid@postgres:5432/gigbid
    REDIS_URL: redis://redis:6379/0
    GIGSIM_BASE_URL: http://gigsim:8081
    OLLAMA_BASE_URL: http://ollama:11434
    MCP_PORTFOLIO_URL: http://mcp-portfolio:8101/mcp
    MCP_MARKETPLACE_URL: http://mcp-marketplace:8102/mcp
    MCP_WORKSPACE_URL: http://mcp-workspace:8103/mcp

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_PASSWORD: gigbid
      POSTGRES_DB: gigbid
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid -d gigbid"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gigsim:
    build: { context: .., dockerfile: infra/docker/gigsim.Dockerfile }
    environment:
      GIGSIM_API_TOKEN: ${GIGSIM_API_TOKEN:-dev-token}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: ["8081:8081"]
    volumes: ["gigsimdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  redisdata:
  gigsimdata:
  ollama:
