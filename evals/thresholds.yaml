# Thresholds for the PR smoke eval (evals/runners/smoke_eval.py). CI fails if violated.
# Baselines are updated deliberately via `eval:` commits, never silently.
smoke:
  jobs: 30
  max_unsupported_claims_per_proposal: 0.5
  min_bid_skip_f1: 0.70
  min_scam_recall: 0.80
  max_p95_latency_seconds_per_job: 90
