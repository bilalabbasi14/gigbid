[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent LangGraph freelancer copilot (MCP, advanced RAG, human-in-the-loop)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  # web / api
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  # agents
  "langgraph>=0.4",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-groq>=0.3",
  "langchain-openai>=0.3",
  "langchain-ollama>=0.3",
  "langchain-mcp-adapters>=0.1",
  "langsmith>=0.3",
  "mcp>=1.9",
  # data / storage
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  # rag
  "sentence-transformers>=3.0",
  "einops>=0.8",
  "rank-bm25>=0.2",
  "pypdf>=4.3",
  "numpy>=1.26",
  # infra / utils
  "httpx>=0.27",
  "tenacity>=9.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "cryptography>=43.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "orjson>=3.10",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "respx>=0.21",
  "aiosqlite>=0.20",
  "syrupy>=4.7",
  "types-pyyaml",
]
eval = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "kaggle>=1.6",
  "langgraph-supervisor>=0.0.20",
  "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag", "mcp_servers", "apps", "worker", "evals", "gigsim"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "data", "gigsim/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "T20"]
ignore = ["S101", "S104", "B008", "E501"]  # E501: ruff format owns line layout
per-file-ignores = { "tests/**" = ["S", "T20"], "evals/**" = ["T20", "S311"], "scripts/**" = ["T20", "S603", "S607"], "data/scripts/**" = ["T20", "S"], "gigsim/**" = ["S311", "T20"] }

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["apps/web", "data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs running services", "slow: slow tests"]
