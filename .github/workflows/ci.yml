name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repo policy (secrets, gigsim lock, prompts, README numbers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/ci_checks.py

  python:
    name: Lint, unit, contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/contract
        env:
          MODEL_PROFILE: open
          LANGSMITH_TRACING: "false"
      - name: Stand-alone Portfolio MCP package (published artifact)
        working-directory: packages/gigbid-portfolio-mcp
        run: uv run --extra dev pytest -q

  web:
    name: Web lint, typecheck, Playwright
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - id: has_web
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.present == 'true'
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        if: steps.has_web.outputs.present == 'true'
      - run: npm run lint
        if: steps.has_web.outputs.present == 'true'
      - run: npm run typecheck
        if: steps.has_web.outputs.present == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.has_web.outputs.present == 'true'
      - run: npm run test:e2e
        if: steps.has_web.outputs.present == 'true'
        env:
          E2E_MOCK_API: "true"
      - uses: actions/upload-artifact@v4
        if: always() && steps.has_web.outputs.present == 'true'
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 14 }
