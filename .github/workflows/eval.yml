name: Smoke eval
# 30-job smoke evaluation on pull requests that touch agent, RAG, MCP, policy or simulator code.
# Fails if unsupported claims rise, bid-or-skip F1 or scam recall drop, or p95 latency exceeds the
# budget (thresholds in evals/thresholds.yaml). Needs the GROQ_API_KEY repository secret; without
# it the job reports "skipped" instead of failing.
on:
  pull_request:
    paths:
      - "agent/**"
      - "rag/**"
      - "mcp_servers/**"
      - "evals/runners/**"
      - "evals/thresholds.yaml"
      - "data/policy_pack/**"
      - "gigsim/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gigbid
          POSTGRES_PASSWORD: gigbid
          POSTGRES_DB: gigbid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MODEL_PROFILE: open
      DATABASE_URL: postgresql+psycopg://gigbid:gigbid@localhost:5432/gigbid
      APP_ENV: test
      LANGSMITH_TRACING: "false"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check model key
        id: key
        run: echo "present=$([ -n "$GROQ_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: steps.key.outputs.present == 'true'
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('agent/config.yaml') }}
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: uv sync --extra dev --extra eval
      - name: Index the persona corpora
        if: steps.key.outputs.present == 'true'
        run: uv run python -m rag.ingest.cli --all
      - name: Run the smoke eval against thresholds
        if: steps.key.outputs.present == 'true'
        run: uv run python -m evals.runners.smoke_eval --jobs 30 --proposals 3 --thresholds evals/thresholds.yaml
      - name: Skipped (no GROQ_API_KEY secret)
        if: steps.key.outputs.present != 'true'
        run: echo "::notice::Smoke eval skipped because the GROQ_API_KEY repository secret is not set"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with: { name: smoke-eval-results, path: "evals/results/smoke_*.json", if-no-files-found: ignore }
