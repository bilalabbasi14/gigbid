name: Deploy
# Pushes main to the Hugging Face Docker Space that serves the public URL, and keeps it awake.
# Needs repository secrets HF_TOKEN (write) and HF_SPACE ("user/space-name"). Skips cleanly if unset.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # keep-alive ping so the free Space does not sleep

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, lfs: false }
      - name: Check deploy secrets
        id: cfg
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: echo "ready=$([ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Assemble the Space repository
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p /tmp/space
          rsync -a --exclude .git --exclude 'data/raw' --exclude 'data/processed' --exclude 'apps/web/node_modules' --exclude 'evals/results' ./ /tmp/space/
          cp infra/docker/space.Dockerfile /tmp/space/Dockerfile
          {
            echo "---"
            echo "title: GigBid"
            echo "emoji: 🧭"
            echo "colorFrom: indigo"
            echo "colorTo: gray"
            echo "sdk: docker"
            echo "app_port: 7860"
            echo "pinned: false"
            echo "---"
            echo
            cat README.md
          } > /tmp/space/README.md
      - name: Upload to the Space
        if: steps.cfg.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        # upload_folder stores binary files (PDF CVs, PNGs, the gzipped job pool) the way the Hub
        # requires; files no longer in the repo are deleted from the Space in the same commit
        run: |
          pip install --quiet "huggingface_hub>=0.26"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path="/tmp/space", repo_id=os.environ["HF_SPACE"], repo_type="space",
              commit_message=f"deploy {os.environ['GITHUB_SHA'][:7]}", delete_patterns=["*"],
          )
          PY

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live URL
        env:
          LIVE_URL: ${{ secrets.LIVE_URL }}
        run: |
          [ -z "$LIVE_URL" ] && { echo "LIVE_URL not set"; exit 0; }
          curl -fsS --max-time 60 "$LIVE_URL/api/health" || curl -fsS --max-time 120 "$LIVE_URL/login" > /dev/null
