name: Deploy
# Deploys main to the production VM over SSH (infra/vm/deploy.sh: pull, rebuild, restart, wait
# until healthy) and checks the public URL. A scheduled run checks the URL every 6 hours, so an
# outage before the hidden test run shows up as a failed workflow.
# Repository secrets: DEPLOY_HOST (the VM's DNS name), DEPLOY_USER (e.g. azureuser),
# DEPLOY_SSH_KEY (private key with access to the VM), LIVE_URL (https://<DEPLOY_HOST>).
# Without them every job skips cleanly.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - name: Check deploy secrets
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: echo "ready=$([ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            "${DEPLOY_USER:-azureuser}@$DEPLOY_HOST" "bash /opt/gigbid/infra/vm/deploy.sh"
      - name: Check the public URL
        if: steps.cfg.outputs.ready == 'true'
        env:
          LIVE_URL: ${{ secrets.LIVE_URL }}
        run: |
          [ -z "$LIVE_URL" ] && { echo "LIVE_URL not set"; exit 0; }
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors --max-time 30 "$LIVE_URL/api/health"
      - name: Skipped
        if: steps.cfg.outputs.ready != 'true'
        run: |
          echo "::notice::Deploy skipped, set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and LIVE_URL"

  uptime:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check the public URL
        env:
          LIVE_URL: ${{ secrets.LIVE_URL }}
        run: |
          [ -z "$LIVE_URL" ] && { echo "LIVE_URL not set"; exit 0; }
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 "$LIVE_URL/api/health"
