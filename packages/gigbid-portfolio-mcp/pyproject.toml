[project]
name = "gigbid-portfolio-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant search your freelance portfolio for evidence, with sources, so it never invents experience."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bilalabbasi14" }]
keywords = ["mcp", "model-context-protocol", "portfolio", "freelance", "rag", "claude", "cursor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.9,<2",  # 2.x renamed the server API (FastMCP -> MCPServer)
  "pydantic>=2.7",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
gigbid-portfolio-mcp = "gigbid_portfolio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/bilalabbasi14/gigbid"
Source = "https://github.com/bilalabbasi14/gigbid/tree/main/packages/gigbid-portfolio-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gigbid_portfolio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
